<!doctype html>
<!-- Minimal stand-in for chatgpt.com with the same selectors the extension relies on. -->
<html><body><main id="thread"></main>
<div id="prompt-textarea" contenteditable="true"></div>
<input type="file" multiple>
<button data-testid="send-button" disabled>Send</button>
<script>
  const ed = document.querySelector('#prompt-textarea'), send = document.querySelector('[data-testid=send-button]');
  const input = document.querySelector('input[type=file]'), main = document.querySelector('main');
  window.uploads = [];
  ed.addEventListener('input', () => (send.disabled = !ed.innerText.trim()));
  input.addEventListener('change', () => window.uploads.push([...input.files].map((f) => f.name)));
  let n = 0;
  send.onclick = () => {
    const text = ed.innerText;
    ed.innerText = ''; send.disabled = true;
    history.pushState({}, '', '/c/abc');
    main.insertAdjacentHTML('beforeend', `<article data-message-author-role="user">${text}</article>`);
    const stop = Object.assign(document.createElement('button'), { textContent: 'Stop' });
    stop.dataset.testid = 'stop-button';
    document.body.append(stop);
    setTimeout(() => {
      stop.remove();
      main.insertAdjacentHTML('beforeend', /REFUSE/.test(text)
        ? `<article data-message-author-role="assistant">I can't create that image.</article>`
        : `<article data-message-author-role="assistant"><img alt="Generated image" src="/backend-api/estuary/content?id=${++n}"></article>`);
    }, 800);
  };
</script></body></html>
